[meta]
name = "vova-arch-minimal"
description = "DevOps & TUI profile for ThinkPad T14"

[packages]
list = [
    "telegram-desktop",
    "firefox",
    "niri",
    "fuzzel",
    "btop",
    "alacritty",
    "cpupower",
    "spotify-launcher",
    "zenity",
    "ffmpeg",
    "xwayland-satellite",
    "xdg-desktop-portal-wlr",
    "qt6-multimedia-ffmpeg",
    "xdg-desktop-portal-gtk",
    "ttf-jetbrains-mono-nerd",
    "bluez",
    "bluez-utils",
    "wireplumber",
    "pipewire",
    "pipewire-pulse",
    "pipewire-alsa",
    "noto-fonts-cjk",
    "unzip",
    "waybar",
    "7zip",
    "mako",
    "swaybg",
    "libnotify",
    "fastfetch",
    "brightnessctl",
    "tlp",
    "tlp-pd",
    "tlp-rdw",
    "powertop",
    "greetd",
    "greetd-tuigreet"
]

[configs]
targets = [
    ".config/niri",
    ".config/alacritty",
    ".config/fuzzel",
    ".config/waybar",
    ".config/mako",
    ".config/helix",
    ".config/fastfetch",
    ".config/xdg-desktop-portal/portals.conf",
    ".bashrc"
]
